[project]
name = "vsc-utils"
version = "3.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andy Georges", email = "itkovian@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "vsc-base",
    "lockfile == 0.12.2",
    "netifaces2 == 0.0.22",
    "jsonpickle == 4.1.1",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsc"]

[project.scripts]

[tool.uv.sources]
vsc-base = { git = "https://github.com/itkovian/vsc-base.git", branch = "uv"}
